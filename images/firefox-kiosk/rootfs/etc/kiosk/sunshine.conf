# Seeded to /data/sunshine/sunshine.conf on first start only.
#
# Sunshine rewrites this file from its web UI, so once the app has run, the copy on the volume is
# the source of truth and this one is only a record of where it started. The running app wins over
# the image for everything except the handful of keys kiosk-seed re-asserts on every start, listed
# under "network" below; sunshine_name is one of them, which is why it is absent here.
#
# FORMATTING, and this is not a style preference: Sunshine's parser strips a trailing `#` comment
# but does NOT strip the whitespace before it, so `encoder = nvenc   # fastest` yields the value
# "nvenc   " and is silently rejected as unknown. Keep every comment on its own line and leave no
# trailing spaces or alignment padding after a value.

min_log_level = info
log_path = /data/sunshine/sunshine.log

# No StatusNotifier host in this container, and no reason to run Qt in it.
system_tray = disabled

# --- capture ---
# wlr = zwlr_screencopy_manager_v1, which labwc advertises. The alternatives do not apply: kms
# needs cap_sys_admin plus a DRM master and cannot address a compositor-virtual output at all, and
# portal would pull in xdg-desktop-portal for no gain on a single-output headless session.
#
# If this fails, read the error carefully: Sunshine says "Missing Wayland wire for
# wlr-export-dmabuf", but the global it actually binds is zwlr_screencopy_manager_v1. That message
# means screencopy is missing, not export-dmabuf.
capture = wlr
output_name = HEADLESS-1

# --- encode ---
encoder = nvenc
# P1, fastest. At 720p/20Mbps nothing slower buys anything visible.
nvenc_preset = 1
# Burns headroom on a GPU that is likely shared with other work, for no gain at this bitrate.
nvenc_twopass = disabled
# The RTX 3050 is Ampere and has no AV1 encoder (h264 and hevc both probe fine, av1 does not).
# Declaring it off skips a startup probe that fails loudly and makes the log look broken.
av1_mode = 0

# --- audio ---
# This app streams no audio, so there is no PipeWire in the image. Left enabled, Sunshine logs a
# capture failure on every session.
stream_audio = disabled

# --- network ---
# Four keys are deliberately absent here and are written by kiosk-seed on EVERY start, from the
# environment the quadlet supplies:
#
#   bind_address          — this container runs with host networking, which it must (Sunshine's
#                           virtual input devices arrive as a netlink hotplug, and netlink is scoped
#                           to the network namespace). On a multi-homed host that would otherwise
#                           put every listener, the 47990 web UI included, on every interface it
#                           has. This binds them to one address instead.
#   csrf_allowed_origins  — the hostname the reverse proxy serves the UI at. Without it, logging in
#                           through the ingress fails with "The request was blocked by CSRF
#                           protection", because Sunshine only trusts localhost and its own bind
#                           address by default.
#   channels              — how many clients may hold the session at once. The default of 1 turns
#                           the second one away with "An app is already running on this host", which
#                           reads like a stuck session rather than a limit. They share one screen
#                           and one cursor; this is not separate desktops per client.
#   sunshine_name         — the machine name Moonlight lists before a client picks an app. Not a
#                           network fact like the three above, but re-asserted for the same reason:
#                           it is set from the environment, so it has to follow the environment.
#                           Left empty the key is dropped and Sunshine uses the host's own name.
#
# Each is set from outside rather than chosen here, so a seeded copy would keep a stale answer after
# the address, the vhost or the name it was given changed. The trade is that none of them can be
# changed from the web UI: an edit there survives until the next restart and is then overwritten.
#
# UPnP would try to map ports on a router that is not doing the forwarding.
upnp = disabled
address_family = ipv4
# Only checks the browser's Origin header - it is not an IP control. The real boundary is wherever
# the deployment puts 47990: keep it off the public interface and reach it through a reverse proxy.
origin_web_ui_allowed = lan

file_apps = /data/sunshine/apps.json
file_state = /data/sunshine/sunshine_state.json
credentials_file = /data/sunshine/credentials.json
pkey = /data/sunshine/credentials/cakey.pem
cert = /data/sunshine/credentials/cacert.pem
